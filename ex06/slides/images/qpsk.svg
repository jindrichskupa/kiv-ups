<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<line x1="40" y1="200" x2="360" y2="200" stroke="#656d76"/>
<line x1="200" y1="360" x2="200" y2="40" stroke="#656d76"/>
<circle cx="200" cy="200" r="127.3" fill="none" stroke="#d0d7de" stroke-dasharray="4 3"/>
<text x="365.0" y="205.0" font-size="15" fill="#656d76" text-anchor="start" font-style="italic">I</text>
<text x="210.0" y="55.0" font-size="15" fill="#656d76" text-anchor="start" font-style="italic">Q</text>
<circle cx="290" cy="110" r="8" fill="#0969da"/>
<text x="290.0" y="138.0" font-size="15" fill="#1f2328" text-anchor="middle" font-family="monospace" font-weight="bold">00</text>
<text x="290.0" y="94.0" font-size="12" fill="#656d76" text-anchor="middle" >φ = 45°</text>
<circle cx="110" cy="110" r="8" fill="#0969da"/>
<text x="110.0" y="138.0" font-size="15" fill="#1f2328" text-anchor="middle" font-family="monospace" font-weight="bold">01</text>
<text x="110.0" y="94.0" font-size="12" fill="#656d76" text-anchor="middle" >φ = 135°</text>
<circle cx="110" cy="290" r="8" fill="#0969da"/>
<text x="110.0" y="318.0" font-size="15" fill="#1f2328" text-anchor="middle" font-family="monospace" font-weight="bold">11</text>
<text x="110.0" y="274.0" font-size="12" fill="#656d76" text-anchor="middle" >φ = 225°</text>
<circle cx="290" cy="290" r="8" fill="#0969da"/>
<text x="290.0" y="318.0" font-size="15" fill="#1f2328" text-anchor="middle" font-family="monospace" font-weight="bold">10</text>
<text x="290.0" y="274.0" font-size="12" fill="#656d76" text-anchor="middle" >φ = 315°</text>
<text x="20.0" y="25.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">QPSK (4-PSK): 4 fáze, stejná amplituda, 2 bity / symbol</text>
<text x="390.0" y="90.0" font-size="14" fill="#1f2328" text-anchor="start" >vzdálenost od středu = amplituda A</text>
<text x="390.0" y="112.0" font-size="14" fill="#1f2328" text-anchor="start" >úhel = fáze φ</text>
<text x="390.0" y="134.0" font-size="14" fill="#1f2328" text-anchor="start" ></text>
<text x="390.0" y="156.0" font-size="14" fill="#1f2328" text-anchor="start" >Grayův kód: sousedé se liší</text>
<text x="390.0" y="178.0" font-size="14" fill="#1f2328" text-anchor="start" >v 1 bitu (00–01–11–10)</text>
<text x="390.0" y="200.0" font-size="14" fill="#1f2328" text-anchor="start" ></text>
<text x="390.0" y="222.0" font-size="14" fill="#1f2328" text-anchor="start" >šum posune bod k sousedovi</text>
<text x="390.0" y="244.0" font-size="14" fill="#1f2328" text-anchor="start" >→ chybný jen 1 bit ze 2</text>
</svg>
