<text x="430.0" y="156.0" font-size="14" fill="#1f2328" text-anchor="start" ></text>
<text x="430.0" y="178.0" font-size="14" fill="#cf222e" text-anchor="start" >červený bod: I = 3, Q = 1</text>
<text x="430.0" y="200.0" font-size="14" fill="#cf222e" text-anchor="start" >→ bity 1011</text>
<text x="430.0" y="222.0" font-size="14" fill="#1f2328" text-anchor="start" ></text>
<text x="430.0" y="244.0" font-size="14" fill="#1f2328" text-anchor="start" >Grayův kód: sousední body</text>
<text x="430.0" y="266.0" font-size="14" fill="#1f2328" text-anchor="start" >se liší o 1 bit → chyba</text>
<text x="430.0" y="288.0" font-size="14" fill="#1f2328" text-anchor="start" >o 1 bod = 1 chybný bit</text>
