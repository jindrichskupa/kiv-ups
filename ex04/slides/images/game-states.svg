<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="840" height="580" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/></marker><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker></defs>
<text x="20.0" y="26.0" font-size="16" fill="#1f2328" text-anchor="start" font-weight="bold">Řešení 10: stavový diagram piškvorek (jedna z možných variant)</text>
<g transform="translate(0,40)">
<rect x="40" y="70" width="170" height="46" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="125.0" y="98.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">CONNECTED</text>
<rect x="330" y="70" width="170" height="46" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="415.0" y="98.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">LOBBY</text>
<rect x="620" y="70" width="170" height="46" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="705.0" y="98.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">WAITING</text>
<rect x="300" y="190" width="520" height="130" rx="14" fill="#f6f8fa" stroke="#656d76" stroke-dasharray="6 4"/>
<text x="808.0" y="212.0" font-size="13" fill="#656d76" text-anchor="end" font-weight="bold">IN_GAME</text>
<rect x="330" y="240" width="170" height="46" rx="10" fill="#dafbe1" stroke="#0969da" stroke-width="2"/><text x="415.0" y="268.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">MY_TURN</text>
<rect x="620" y="240" width="170" height="46" rx="10" fill="#fff8c5" stroke="#0969da" stroke-width="2"/><text x="705.0" y="268.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">OPPONENT_TURN</text>
<rect x="330" y="400" width="170" height="46" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/><text x="415.0" y="428.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">GAME_OVER</text>
<rect x="40" y="400" width="170" height="46" rx="10" fill="#ffebe9" stroke="#0969da" stroke-width="2"/><text x="125.0" y="428.0" font-size="14" fill="#1f2328" text-anchor="middle" font-weight="bold">DISCONNECTED</text>
<path d="M90,70 C70,20 160,20 140,70" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="115.0" y="30.0" font-size="11" fill="#1f2328" text-anchor="middle" >LOGIN chybný → LOGIN_ERR</text>
<path d="M210,93 L328,93" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="269.0" y="84.0" font-size="12" fill="#1f2328" text-anchor="middle" >LOGIN ok</text>
<path d="M500,85 L618,85" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="559.0" y="76.0" font-size="12" fill="#1f2328" text-anchor="middle" >CREATE / JOIN</text>
<path d="M618,103 L500,103" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="559.0" y="121.0" font-size="12" fill="#1f2328" text-anchor="middle" >LEAVE</text>
<path d="M705,116 L705,238" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="712.0" y="175.0" font-size="12" fill="#1f2328" text-anchor="start" >soupeř přišel</text>
<path d="M500,255 L618,255" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="559.0" y="247.0" font-size="12" fill="#1f2328" text-anchor="middle" >MOVE ok</text>
<path d="M618,275 L500,275" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="559.0" y="295.0" font-size="12" fill="#1f2328" text-anchor="middle" >soupeř: MOVE</text>
<path d="M360,240 C340,190 420,190 400,240" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="380.0" y="186.0" font-size="11" fill="#1f2328" text-anchor="middle" >MOVE špatný → MOVE_ERR</text>
<path d="M415,320 L415,398" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="424.0" y="362.0" font-size="12" fill="#1f2328" text-anchor="start" >výhra / prohra / remíza</text>
<path d="M330,410 C250,380 300,170 395,118" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#ar)"/><text x="250.0" y="300.0" font-size="12" fill="#1f2328" text-anchor="end" >REMATCH / LEAVE</text>
<path d="M300,300 C200,330 160,360 125,398" fill="none" stroke="#cf222e" stroke-width="1.6" marker-end="url(#arr)" stroke-dasharray="6 4"/><text x="190.0" y="345.0" font-size="12" fill="#cf222e" text-anchor="end" >PING timeout (15 s)</text>
<path d="M210,435 C270,470 520,470 700,322" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ar)"/><text x="470.0" y="480.0" font-size="12" fill="#1a7f37" text-anchor="middle" >LOGIN stejné jméno do 60 s → obnovit hru (RECONNECT)</text>
<text x="20.0" y="520.0" font-size="13" fill="#656d76" text-anchor="start" >Z libovolného stavu: PING ← → PONG; neznámá / nevalidní zpráva → ERR, po 3 chybách odpojit.</text>
</g>
</svg>
